<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RouteWeaver - Interactive Travel Map & Timeline</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="app-container">
        <!-- Leaflet Map Container -->
        <div id="map"></div>

        <!-- Sidebar Panel for Configuration & List -->
        <aside id="sidebar">
            <!-- Mode Toggle Tabs -->
            <div class="mode-tabs">
                <button class="mode-tab active" data-mode="manual">
                    <i data-lucide="edit-3" style="width: 16px; height: 16px;"></i>
                    Manual Planner
                </button>
                <button class="mode-tab" data-mode="explorer">
                    <i data-lucide="sparkles" style="width: 16px; height: 16px;"></i>
                    Route Explorer
                </button>
            </div>

            <div class="sidebar-content">
                <!-- Mode 1: Manual Planner Container -->
                <div id="mode-manual-container" class="mode-container active">
                    <!-- Skyscanner Importer -->
                    <section class="form-section" style="margin-bottom: 0px;">
                        <div class="form-group" style="margin-bottom: 12px;">
                            <label for="link-import-input">Import Skyscanner Flight Link</label>
                            <div class="input-container" style="display: flex; gap: 8px;">
                                <i data-lucide="link" class="input-icon"></i>
                                <input type="text" id="link-import-input" placeholder="Paste Skyscanner URL here..." autocomplete="off">
                            </div>
                            <button type="button" id="btn-import-link" class="btn btn-secondary" style="width: 100%; margin-top: 8px; font-size: 0.85rem; padding: 10px;">
                                <i data-lucide="download"></i> Import Skyscanner Flight
                            </button>
                        </div>
                    </section>

                    <div style="display: flex; align-items: center; gap: 8px; margin: 15px 0;">
                        <hr style="flex: 1; border: 0; border-top: 1px solid var(--border-color);">
                        <span style="font-size: 0.7rem; color: var(--text-muted); font-weight: 600; letter-spacing: 0.05em;">OR ADD MANUALLY</span>
                        <hr style="flex: 1; border: 0; border-top: 1px solid var(--border-color);">
                    </div>

                    <!-- Add Route Form -->
                    <section class="form-section">
                        <form id="route-form">
                            <!-- Origin Input -->
                            <div class="form-group autocomplete-container">
                                <label for="origin-input">Departure City / Airport</label>
                                <div class="input-container">
                                    <i data-lucide="plane-departure" class="input-icon"></i>
                                    <input type="text" id="origin-input" placeholder="Search departure location..." required autocomplete="off">
                                </div>
                                <div id="origin-suggestions" class="suggestions-list" style="display: none;"></div>
                            </div>

                            <!-- Destination Input -->
                            <div class="form-group autocomplete-container">
                                <label for="destination-input">Arrival City / Airport</label>
                                <div class="input-container">
                                    <i data-lucide="plane-arrival" class="input-icon"></i>
                                    <input type="text" id="destination-input" placeholder="Search arrival location..." required autocomplete="off">
                                </div>
                                <div id="destination-suggestions" class="suggestions-list" style="display: none;"></div>
                            </div>

                            <!-- Departure & Arrival Date/Time -->
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="departure-time">Departure Time</label>
                                    <div class="input-container">
                                        <i data-lucide="calendar" class="input-icon"></i>
                                        <input type="datetime-local" id="departure-time" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="arrival-time">Arrival Time</label>
                                    <div class="input-container">
                                        <i data-lucide="calendar-check" class="input-icon"></i>
                                        <input type="datetime-local" id="arrival-time" required>
                                    </div>
                                </div>
                            </div>

                            <!-- Price & Color Picker -->
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="route-price">Price ($)</label>
                                    <div class="input-container">
                                        <i data-lucide="dollar-sign" class="input-icon"></i>
                                        <input type="number" id="route-price" min="0" placeholder="Price" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="route-color">Route Theme Color</label>
                                    <div class="input-container">
                                        <i data-lucide="palette" class="input-icon"></i>
                                        <select id="route-color" required>
                                            <option value="#6366f1" style="color: #6366f1">Indigo Glow</option>
                                            <option value="#10b981" style="color: #10b981">Emerald Green</option>
                                            <option value="#ec4899" style="color: #ec4899">Hot Pink</option>
                                            <option value="#f59e0b" style="color: #f59e0b">Amber Gold</option>
                                            <option value="#06b6d4" style="color: #06b6d4">Cyan Wave</option>
                                            <option value="#a855f7" style="color: #a855f7">Neon Purple</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
                                <i data-lucide="plus-circle"></i> Add Route
                            </button>
                        </form>
                    </section>

                    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">

                    <!-- Active Routes List -->
                    <section>
                        <div class="route-section-title">
                            <span>Planned Routes</span>
                            <span id="route-count" style="font-size: 0.8rem; color: var(--text-muted);">0 routes</span>
                        </div>
                        <div id="routes-list" class="routes-list">
                            <!-- Dynamically populated -->
                            <div class="empty-state">
                                <i data-lucide="map-pin" style="width: 32px; height: 32px;"></i>
                                <p>No routes added yet.<br>Fill the form to map your first flight!</p>
                            </div>
                        </div>
                    </section>
                </div>

                <!-- Mode 2: Route Explorer Container -->
                <div id="mode-explorer-container" class="mode-container">
                    <!-- Route Explorer Form -->
                    <section class="form-section">
                        <form id="explorer-form">
                            <!-- Origin Input -->
                            <div class="form-group autocomplete-container">
                                <label for="explorer-origin-input">Starting City / Airport</label>
                                <div class="input-container">
                                    <i data-lucide="plane-departure" class="input-icon"></i>
                                    <input type="text" id="explorer-origin-input" placeholder="Search departure..." required autocomplete="off">
                                </div>
                                <div id="explorer-origin-suggestions" class="suggestions-list" style="display: none;"></div>
                            </div>

                            <!-- Destination Input -->
                            <div class="form-group autocomplete-container">
                                <label for="explorer-destination-input">Destination City / Airport</label>
                                <div class="input-container">
                                    <i data-lucide="plane-arrival" class="input-icon"></i>
                                    <input type="text" id="explorer-destination-input" placeholder="Search destination..." required autocomplete="off">
                                </div>
                                <div id="explorer-destination-suggestions" class="suggestions-list" style="display: none;"></div>
                            </div>

                            <!-- Dates -->
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="explorer-start-date">Earliest Start Date</label>
                                    <div class="input-container">
                                        <i data-lucide="calendar" class="input-icon"></i>
                                        <input type="datetime-local" id="explorer-start-date" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="explorer-target-date">Latest Arrival Date</label>
                                    <div class="input-container">
                                        <i data-lucide="calendar-check" class="input-icon"></i>
                                        <input type="datetime-local" id="explorer-target-date" required>
                                    </div>
                                </div>
                            </div>

                            <!-- Budget -->
                            <div class="form-group">
                                <label for="explorer-budget">Max Budget ($)</label>
                                <div class="input-container">
                                    <i data-lucide="dollar-sign" class="input-icon"></i>
                                    <input type="number" id="explorer-budget" min="10" placeholder="e.g. 1500" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
                                <i data-lucide="search"></i> Find Stops & Flights
                            </button>
                        </form>
                    </section>

                    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">

                    <!-- Generated Itineraries List -->
                    <section>
                        <div class="route-section-title">
                            <span>Suggested Stopovers</span>
                            <span id="itinerary-count" style="font-size: 0.8rem; color: var(--text-muted);">0 routes</span>
                        </div>
                        <div id="itineraries-list" class="routes-list">
                            <div class="empty-state">
                                <i data-lucide="sparkles" style="width: 32px; height: 32px;"></i>
                                <p>Search to generate stopover flights.<br>We'll find cheap multi-hop options with 1–3 day layovers!</p>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </aside>
        
        <button id="sidebar-toggle" aria-label="Toggle Sidebar" title="Collapse/Expand Panel">
            <i data-lucide="chevron-right"></i>
        </button>

        <!-- Bottom Timeline Slider and Playback Controls -->
        <div id="timeline-container">
            <div class="timeline-controls">
                <button id="play-pause-btn" class="play-btn" title="Play Animation">
                    <i data-lucide="play" id="play-icon"></i>
                </button>
                <div class="speed-segments" title="Simulation Speed">
                    <button type="button" class="speed-segment" data-speed="1">1x</button>
                    <button type="button" class="speed-segment" data-speed="60">1m/s</button>
                    <button type="button" class="speed-segment active" data-speed="3600">1h/s</button>
                    <button type="button" class="speed-segment" data-speed="86400">1d/s</button>
                </div>
            </div>

            <div class="timeline-track-container">
                <div class="timeline-info">
                    <span id="timeline-start-label">Start Time</span>
                    <span id="timeline-current-label" class="timeline-current-time">Timeline Inactive</span>
                    <span id="timeline-end-label">End Time</span>
                </div>
                <div class="slider-wrapper">
                    <div id="timeline-track-wrapper">
                        <!-- Redesigned Scale overlay containing weekends, days, stays and nodes -->
                        <div id="timeline-scale-overlay"></div>
                        <input type="range" id="timeline-slider" class="timeline-slider" min="0" max="1000" value="0" disabled>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- App entry points -->
    <script src="geodesic.js"></script>
    <script src="app.js"></script>
</body>
</html>
