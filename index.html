<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Travel Map & Timeline</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3Cpolygon points='16.24,7.76 14.12,14.12 7.76,16.24 9.88,9.88'/%3E%3C/svg%3E" />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="app-container">
        <!-- Leaflet Map Container -->
        <div id="map"></div>

        <!-- Left Panel for Calculated/Suggested Itineraries -->
        <aside id="left-panel">
            <div class="left-panel-content">
                <!-- Mode 1: Computed Itineraries -->
                <div id="left-manual-container" class="left-mode-container active">
                    <section class="itinerary-options-section" style="padding: 20px 20px 10px 20px;">
                        <div class="route-section-title" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                            <span>Routes</span>
                            <div style="display: flex; gap: 8px; align-items: center;">
                                <button type="button" id="btn-add-leg-left" class="btn btn-primary" style="padding: 6px 12px; font-size: 0.75rem; display: inline-flex; align-items: center; gap: 4px; border-radius: 6px;">
                                    <i data-lucide="plus-circle" style="width: 12px; height: 12px;"></i> Add Flight Leg
                                </button>
                                <button type="button" id="btn-update-prices-left" class="btn-action" title="Update Prices Data">
                                    <i data-lucide="refresh-cw" style="width: 14px; height: 14px;"></i>
                                </button>
                            </div>
                        </div>
                        <div id="manual-itineraries-list" class="itineraries-list">
                            <!-- Dynamically populated option cards -->
                            <div class="empty-state">
                                <i data-lucide="compass" style="width: 32px; height: 32px;"></i>
                                <p>No options available.<br>Add flights to auto-calculate routes!</p>
                            </div>
                        </div>
                    </section>


                </div>


            </div>
        </aside>

        <!-- Second Panel (Slide-out Editor/Configurator next to Left Panel) -->
        <aside id="edit-panel" class="collapsed">
            <div class="edit-panel-header">
                <h3 id="edit-panel-title">Route Editor</h3>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <button type="button" id="btn-update-prices" class="btn-action" title="Update Prices Data">
                        <i data-lucide="refresh-cw" style="width: 16px; height: 16px;"></i>
                    </button>
                    <button type="button" id="btn-close-edit-panel" class="close-btn" title="Close Panel">
                        <i data-lucide="x" style="width: 16px; height: 16px;"></i>
                    </button>
                </div>
            </div>
            <div class="edit-panel-content">
                <!-- Mode 1 Editor Content -->
                <div id="edit-manual-container" class="edit-mode-container active">
                    <!-- Mode 1 details list (default active) -->
                    <div id="edit-manual-details" class="edit-sub-container active">
                        <!-- Dynamically rendered list of flights & layovers -->
                    </div>
                </div>
            </div>
        </aside>

        <!-- Third Panel (Slide-out Form next to Second Panel) -->
        <aside id="form-panel" class="collapsed">
            <div class="edit-panel-header">
                <h3 id="manual-form-title">Add New Flight Leg</h3>
                <button type="button" id="btn-close-form-panel" class="close-btn" title="Close Panel">
                    <i data-lucide="x" style="width: 16px; height: 16px;"></i>
                </button>
            </div>
            <div class="edit-panel-content">
                <div id="edit-manual-form-container" class="edit-sub-container active">
                    <!-- Skyscanner Importer -->
                    <section class="form-section" style="margin-bottom: 0px; padding: 0; background: transparent; border: none; box-shadow: none;">
                        <div class="form-group" style="margin-bottom: 12px;">
                            <label for="link-import-input">Import Skyscanner Flight Link</label>
                            <div class="input-container" style="display: flex; gap: 8px;">
                                <i data-lucide="link" class="input-icon"></i>
                                <input type="text" id="link-import-input" placeholder="Paste Skyscanner URL here..." autocomplete="off">
                            </div>
                            <button type="button" id="btn-import-link" class="btn btn-secondary" style="width: 100%; margin-top: 8px; font-size: 0.85rem; padding: 10px;">
                                <i data-lucide="download"></i> Import Skyscanner Flight
                            </button>
                        </div>
                    </section>

                    <div style="display: flex; align-items: center; gap: 8px; margin: 10px 0;">
                        <hr style="flex: 1; border: 0; border-top: 1px solid var(--border-color);">
                        <span style="font-size: 0.65rem; color: var(--text-muted); font-weight: 600; letter-spacing: 0.05em;">OR ADD MANUALLY</span>
                        <hr style="flex: 1; border: 0; border-top: 1px solid var(--border-color);">
                    </div>

                    <!-- Add Route Form -->
                    <section class="form-section" style="padding: 0; background: transparent; border: none; box-shadow: none;">
                        <form id="route-form">
                            <div class="form-group autocomplete-container">
                                <label for="origin-input">Departure City / Airport</label>
                                <div class="input-container">
                                    <i data-lucide="plane-departure" class="input-icon"></i>
                                    <input type="text" id="origin-input" placeholder="Search departure location..." required autocomplete="off">
                                </div>
                                <div id="origin-suggestions" class="suggestions-list" style="display: none;"></div>
                            </div>

                            <div class="form-group autocomplete-container">
                                <label for="destination-input">Arrival City / Airport</label>
                                <div class="input-container">
                                    <i data-lucide="plane-arrival" class="input-icon"></i>
                                    <input type="text" id="destination-input" placeholder="Search arrival location..." required autocomplete="off">
                                </div>
                                <div id="destination-suggestions" class="suggestions-list" style="display: none;"></div>
                            </div>

                            <div class="form-group">
                                <label for="departure-time">Departure Time</label>
                                <div class="input-container">
                                    <i data-lucide="calendar" class="input-icon calendar-trigger" style="pointer-events: auto; cursor: pointer;"></i>
                                    <input type="datetime-local" id="departure-time" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="arrival-time">Arrival Time</label>
                                <div class="input-container">
                                    <i data-lucide="calendar-check" class="input-icon calendar-trigger" style="pointer-events: auto; cursor: pointer;"></i>
                                    <input type="datetime-local" id="arrival-time" required>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="route-price">Price ($)</label>
                                    <div class="input-container">
                                        <i data-lucide="dollar-sign" class="input-icon"></i>
                                        <input type="number" id="route-price" min="0" placeholder="Price" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="route-color">Route Theme Color</label>
                                    <div class="input-container">
                                        <i data-lucide="palette" class="input-icon"></i>
                                        <select id="route-color" required>
                                            <option value="#6366f1" style="color: #6366f1">Indigo Glow</option>
                                            <option value="#10b981" style="color: #10b981">Emerald Green</option>
                                            <option value="#ec4899" style="color: #ec4899">Hot Pink</option>
                                            <option value="#f59e0b" style="color: #f59e0b">Amber Gold</option>
                                            <option value="#06b6d4" style="color: #06b6d4">Cyan Wave</option>
                                            <option value="#a855f7" style="color: #a855f7">Neon Purple</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="route-link">Flight Link (Optional)</label>
                                <div class="input-container">
                                    <i data-lucide="link-2" class="input-icon"></i>
                                    <input type="url" id="route-link" placeholder="https://example.com/flight-details">
                                </div>
                            </div>

                            <button type="submit" id="btn-submit-route" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
                                <i data-lucide="plus-circle"></i> Add Route
                            </button>
                        </form>
                    </section>
                </div>
            </div>
        </aside>

        <button id="left-panel-toggle" aria-label="Toggle Left Panel" title="Collapse/Expand Panel">
            <i data-lucide="chevron-left"></i>
        </button>

        <!-- Bottom Timeline Slider and Playback Controls -->
        <div id="timeline-container">


            <div class="timeline-track-container">
                <div class="timeline-info">
                    <span id="timeline-start-label">Start Time</span>
                    <span id="timeline-current-label" class="timeline-current-time">Timeline Inactive</span>
                    <span id="timeline-end-label">End Time</span>
                </div>
                <div class="slider-wrapper">
                    <div id="timeline-track-wrapper">
                        <!-- Redesigned Scale overlay containing weekends, days, stays and nodes -->
                        <div id="timeline-scale-overlay"></div>
                        <input type="range" id="timeline-slider" class="timeline-slider" min="0" max="1000" value="0" disabled>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Price Update Modal Dialog -->
    <div id="price-update-modal-overlay" class="price-update-modal-overlay">
        <div class="price-update-modal">
            <div class="price-update-modal-header">
                <h3><i data-lucide="bell" style="width: 18px; height: 18px; color: var(--secondary);"></i> Live Price Updates</h3>
                <button type="button" id="btn-close-price-modal" class="close-btn" title="Close Panel">
                    <i data-lucide="x" style="width: 16px; height: 16px;"></i>
                </button>
            </div>
            <div id="price-update-modal-body" class="price-update-modal-body">
                <!-- Dynamically populated changes list -->
            </div>
            <div class="price-update-modal-footer">
                <button type="button" id="btn-price-modal-ok" class="btn btn-primary" style="padding: 8px 16px; font-size: 0.85rem;">Got it</button>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- App entry points -->
    <script src="geodesic.js"></script>
    <script src="app.js"></script>
</body>
</html>
